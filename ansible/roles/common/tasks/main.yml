---
- name: Atualizar cache do apt
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Instalar pacotes comuns
  apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - ca-certificates
      - apt-transport-https
      - software-properties-common
      - gnupg
      - lsb-release
    state: present

- name: Habilitar IP forwarding (para k8s)
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes
  when: "'k8s_cluster' in group_names"

- name: Desabilitar swap (requisito k8s)
  command: swapoff -a
  when: "'k8s_cluster' in group_names"

- name: Remover swap do fstab
  lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent
  when: "'k8s_cluster' in group_names"

- name: Carregar módulos do kernel necessários para k8s
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  when: "'k8s_cluster' in group_names"

- name: Persistir módulos do kernel
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'
  when: "'k8s_cluster' in group_names"

- name: Configurar sysctl para k8s
  copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: '0644'
  when: "'k8s_cluster' in group_names"

- name: Aplicar sysctl
  command: sysctl --system
  when: "'k8s_cluster' in group_names"

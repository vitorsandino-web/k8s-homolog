---
- name: Instalar iptables-persistent
  apt:
    name:
      - iptables-persistent
    state: present
    update_cache: yes

- name: Habilitar IP forwarding (runtime + persistente)
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: MASQUERADE na interface pública (saída pra internet)
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ public_interface }}"
    jump: MASQUERADE
    comment: "NAT saida para internet"

- name: FORWARD privada -> publica (novas conexões)
  iptables:
    chain: FORWARD
    in_interface: "{{ private_interface }}"
    out_interface: "{{ public_interface }}"
    jump: ACCEPT
    comment: "Forward saida"

- name: FORWARD publica -> privada (apenas conexões estabelecidas)
  iptables:
    chain: FORWARD
    in_interface: "{{ public_interface }}"
    out_interface: "{{ private_interface }}"
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "Forward retorno"

- name: Persistir regras iptables
  shell: netfilter-persistent save
  changed_when: true

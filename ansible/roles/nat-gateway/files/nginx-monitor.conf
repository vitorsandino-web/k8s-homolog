server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Grafana (rewrite Host header)
    location /grafana/ {
        proxy_pass http://10.0.0.201:80/;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /grafana {
        return 301 /grafana/;
    }

    # Zabbix
    location /zabbix/ {
        proxy_pass http://10.0.0.201:80/;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /zabbix {
        return 301 /zabbix/;
    }

    # Default
    location / {
        return 200 "k8s-homolog cluster monitor\n  Grafana: /grafana/\n  Zabbix:  /zabbix/\n";
        add_header Content-Type text/plain;
    }
}

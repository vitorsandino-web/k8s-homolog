server {
    listen 177.91.66.37:80 default_server;
    server_name grafana.k8s.homolog 177.91.66.37;

    location / {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
        # Rewrite HTML body
        sub_filter '<base href="/"' '<base href="/grafana/"';
        sub_filter 'href="/' 'href="/grafana/';
        sub_filter 'src="/' 'src="/grafana/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
}


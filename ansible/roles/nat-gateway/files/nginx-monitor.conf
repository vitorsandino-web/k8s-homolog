server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Raiz -> Grafana
    location = / {
        return 301 /grafana/login;
    }

    # Grafana: path /grafana/* com Host rewrite
    location /grafana/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana devolve Location: /login (relativo) - rewrite para /grafana/login
        sub_filter 'Location: /login' 'Location: /grafana/login';
        sub_filter 'Location: /' 'Location: /grafana/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
    location = /grafana {
        return 301 /grafana/;
    }
    # Grafana redirect paths (sem /grafana prefix - gerado pelo Location rewrite)
    location ~ ^/(login|d/|api/|admin/|public/|avatar|user/) {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'Location: /login' 'Location: /grafana/login';
        sub_filter 'Location: /' 'Location: /grafana/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }

    # Zabbix: path /zabbix/*
    location /zabbix/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Zabbix devolve Location: /zabbix.php (relativo) - rewrite para /zabbix/zabbix.php
        sub_filter 'Location: /zabbix.php' 'Location: /zabbix/zabbix.php';
        sub_filter 'Location: /charts.php' 'Location: /zabbix/charts.php';
        sub_filter 'Location: /' 'Location: /zabbix/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
    location = /zabbix {
        return 301 /zabbix/;
    }
    # Zabbix redirect paths (sem /zabbix prefix)
    location ~ ^/(index\.php|zabbix\.php|charts\.php|chart2\.php|chart\.php|api_jsonrpc\.php|api_ajax\.php) {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'Location: /zabbix.php' 'Location: /zabbix/zabbix.php';
        sub_filter 'Location: /charts.php' 'Location: /zabbix/charts.php';
        sub_filter 'Location: /' 'Location: /zabbix/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
}

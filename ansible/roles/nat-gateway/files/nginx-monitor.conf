server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Raiz -> Grafana
    location = / {
        return 301 /grafana/login;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'Location: /login' 'Location: /grafana/login';
        sub_filter 'Location: /' 'Location: /grafana/';
        sub_filter_types text/html application/json;
        sub_filter_once off;
    }
    location = /grafana {
        return 301 /grafana/;
    }
    location ~ ^/(login|d/|api/|admin/|public/) {
        proxy_pass http://10.0.0.201:80;
        proxy_set_header Host "grafana.k8s.homolog";
        sub_filter 'Location: /login' 'Location: /grafana/login';
        sub_filter 'Location: /' 'Location: /grafana/';
        sub_filter_types text/html application/json;
        sub_filter_once off;
    }

    # Zabbix
    location /zabbix/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter 'Location: /' 'Location: /zabbix/';
        sub_filter_types text/html application/json;
        sub_filter_once off;
    }
    location = /zabbix {
        return 301 /zabbix/;
    }
}

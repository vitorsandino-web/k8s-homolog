server {
    listen 177.91.66.37:80 default_server;
    server_name grafana.k8s.homolog 177.91.66.37;

    # Grafana: ALL paths rewrite to add /grafana/ prefix before upstream
    location / {
        # Catch-all: add /grafana prefix
        rewrite ^(/.*)$ /grafana$1 break;
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
    }
}

server {
    listen 177.91.66.38:80;
    server_name zabbix.k8s.homolog 177.91.66.38;

    # Zabbix: ALL paths rewrite to add /zabbix/ prefix before upstream
    location / {
        rewrite ^(/.*)$ /zabbix$1 break;
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
    }
}

# Fallback: redirect 177.91.66.34 (main) -> Grafana
server {
    listen 177.91.66.34:80;
    server_name 177.91.66.34;
    location = / {
        return 302 http://177.91.66.37/grafana/login;
    }
    location / {
        return 302 http://177.91.66.37$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Raiz -> Grafana
    location = / {
        return 301 /grafana/login;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
        sub_filter 'Location: /login' 'Location: /grafana/login';
        sub_filter 'Location: /' 'Location: /grafana/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
    location = /grafana {
        return 301 /grafana/;
    }
    location ~ ^/(login|d/|api/|admin/|public/) {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "grafana.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
        sub_filter 'Location: /login' 'Location: /grafana/login';
        sub_filter 'Location: /' 'Location: /grafana/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }

    # Zabbix
    location /zabbix/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
        sub_filter 'Location: /zabbix.php' 'Location: /zabbix/zabbix.php';
        sub_filter 'Location: /charts.php' 'Location: /zabbix/charts.php';
        sub_filter 'Location: /index.php' 'Location: /zabbix/index.php';
        sub_filter 'Location: /' 'Location: /zabbix/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
    location = /zabbix {
        return 301 /zabbix/;
    }
    location ~ ^/(index\.php|zabbix\.php|charts\.php|chart2\.php|chart\.php|api_jsonrpc\.php|api_ajax\.php) {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
        sub_filter 'Location: /zabbix.php' 'Location: /zabbix/zabbix.php';
        sub_filter 'Location: /charts.php' 'Location: /zabbix/charts.php';
        sub_filter 'Location: /index.php' 'Location: /zabbix/index.php';
        sub_filter 'Location: /' 'Location: /zabbix/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }
    location ~ ^/(assets|js|fonts|locale|img|images)/ {
        proxy_pass http://10.0.0.201:80;
        proxy_http_version 1.1;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";
    }
    location = /favicon.ico {
        proxy_pass http://10.0.0.201:80;
        proxy_set_header Host "zabbix.k8s.homolog";
        proxy_set_header Accept-Encoding "identity";
    }
}

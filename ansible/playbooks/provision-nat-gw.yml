---
# Provisiona o nat-gateway (VM 200) via Proxmox.
# Substitui o Terraform pra evitar drift detection quando o disco é expandido.
#
# Por que SSH e não API: a API REST do Proxmox retorna 500 em algumas operações
# (clone) por inconsistência de cache quando há destruição recente de VM.
# O SSH via qm CLI é mais determinístico e legível em logs.
#
# Pré-requisito:
#   - proxmox_root_password (env var ou -e)
#   - Template 9000 já criado no Proxmox (ver docs/SETUP.md §2.2)

- name: Provisionar nat-gateway via Proxmox
  hosts: localhost
  gather_facts: false
  vars:
    proxmox_ssh: "sshpass -p '{{ proxmox_root_password }}' ssh -o StrictHostKeyChecking=accept-new root@{{ proxmox_host }}"
    nat_gw_vm_id: 200
    nat_gw_name: "nat-gw"
    nat_gw_private_ip: "10.0.0.1/24"
    nat_gw_public_ip: "177.91.66.34/29"
    nat_gw_public_gw: "177.91.66.33"
    nat_gw_memory_mb: 1024
    nat_gw_cores: 4
    nat_gw_disk_gb: 8
    nat_gw_template_id: 9000
    # Autenticação via user/senha (lab/homolog) — provida pelo template cloud-init
    default_username: homolog
    default_password: "Homolog@2026!"
  tasks:
    - name: Verificar se VM 200 já existe
      shell: "{{ proxmox_ssh }} \"qm list | grep -E '^ *{{ nat_gw_vm_id }} '\""
      register: vm_check
      changed_when: false
      failed_when: false

    - name: VM 200 existe, pulando criação
      debug:
        msg: "VM 200 (nat-gw) já existe no Proxmox, pulando criação"
      when: vm_check.rc == 0

    - name: Limpar lock órfão da VM 200 (se existir)
      shell: |
        {{ proxmox_ssh }} "
          pkill -9 -f 'kvm -id {{ nat_gw_vm_id }}' 2>/dev/null
          sleep 2
          qm unlock {{ nat_gw_vm_id }} 2>/dev/null
          rm -f /var/lock/qemu-server/lock-{{ nat_gw_vm_id }}.conf
        "
      changed_when: false
      failed_when: false
      when: vm_check.rc != 0

    - name: Destruir qualquer VM 200 residual
      shell: |
        {{ proxmox_ssh }} "
          qm destroy {{ nat_gw_vm_id }} --purge 2>/dev/null || true
          rm -f /etc/pve/qemu-server/{{ nat_gw_vm_id }}.conf 2>/dev/null
          lvremove -f pve/vm-{{ nat_gw_vm_id }}-cloudinit pve/vm-{{ nat_gw_vm_id }}-disk-0 pve/vm-{{ nat_gw_vm_id }}-disk-1 2>/dev/null || true
        "
      changed_when: false
      failed_when: false
      when: vm_check.rc != 0

    - name: Criar VM 200 (nat-gw) via clone do template
      shell: "{{ proxmox_ssh }} \"qm clone {{ nat_gw_template_id }} {{ nat_gw_vm_id }} --name {{ nat_gw_name }} --full 0\""
      register: clone_result
      when: vm_check.rc != 0

    - name: Aguardar clone completar
      shell: "{{ proxmox_ssh }} \"qm list | grep -E '^ *{{ nat_gw_vm_id }} '\""
      register: vm_status
      until: vm_status.rc == 0
      retries: 30
      delay: 2
      when: vm_check.rc != 0

    - name: Configurar VM 200 (CPU, memória, rede)
      shell: |
        {{ proxmox_ssh }} "qm set {{ nat_gw_vm_id }} \
          --memory {{ nat_gw_memory_mb }} \
          --cores {{ nat_gw_cores }} \
          --net0 virtio,bridge=vmbr0 \
          --net1 virtio,bridge=vmbr0 \
          --ipconfig0 ip={{ nat_gw_private_ip }} \
          --ipconfig1 ip={{ nat_gw_public_ip }},gw={{ nat_gw_public_gw }} \
          --agent 1"
      when: vm_check.rc != 0

    - name: Expandir disco para {{ nat_gw_disk_gb }}G
      shell: "{{ proxmox_ssh }} \"qm disk resize {{ nat_gw_vm_id }} scsi0 +{{ nat_gw_disk_gb | int - 3 }}G\""
      when: vm_check.rc != 0

    - name: Iniciar VM 200
      shell: "{{ proxmox_ssh }} \"qm start {{ nat_gw_vm_id }}\""
      when: vm_check.rc != 0

    - name: Aguardar SSH ficar disponível
      wait_for:
        host: "{{ nat_gw_public_ip | ipaddr('address') }}"
        port: 22
        timeout: 180
      delegate_to: localhost
      when: vm_check.rc != 0

    - name: nat-gw provisionado
      debug:
        msg: "nat-gw (VM 200) provisionado e acessível via SSH em {{ nat_gw_public_ip | ipaddr('address') }}"
      when: vm_check.rc != 0

---
# Provisiona o nat-gateway (VM 200) via Proxmox API.
# Substitui o Terraform pra evitar drift detection quando o disco é expandido.
#
# Pré-requisito:
#   - TF_VAR_proxmox_api_token configurado
#   - Template 9000 já criado no Proxmox (ver docs/SETUP.md §2.2)

- name: Provisionar nat-gateway via Proxmox
  hosts: localhost
  gather_facts: false
  vars:
    proxmox_api_url: "https://{{ proxmox_host }}:8006/api2/json"
    nat_gw_vm_id: 200
    nat_gw_name: "nat-gw"
    nat_gw_private_ip: "10.0.0.1/24"
    nat_gw_public_ip: "177.91.66.34/29"
    nat_gw_public_gw: "177.91.66.33"
    nat_gw_memory_mb: 1024
    nat_gw_cores: 4
    nat_gw_disk_gb: 8
    nat_gw_template_id: 9000
    ssh_public_key_path: "/root/.ssh/id_ed25519_k8s.pub"
  tasks:
    - name: Ler chave SSH pública
      slurp:
        src: "{{ ssh_public_key_path }}"
      register: ssh_key_raw

    - name: Decodificar chave
      set_fact:
        ssh_public_key: "{{ ssh_key_raw.content | b64decode | trim }}"

    - name: Verificar se VM 200 já existe
      uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/qemu/{{ nat_gw_vm_id }}/status"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_token }}"
        validate_certs: false
        status_code: 200, 404
      register: vm_check

    - name: VM 200 existe, pulando criação
      debug:
        msg: "VM 200 (nat-gw) já existe no Proxmox, pulando criação"
      when: vm_check.status == 200

    - name: Criar VM 200 (nat-gw) via clone do template
      uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/qemu/{{ nat_gw_vm_id }}/clone"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_token }}"
        body_format: form-urlencoded
        body:
          newid: "{{ nat_gw_vm_id }}"
          name: "{{ nat_gw_name }}"
          full: 0
        validate_certs: false
      when: vm_check.status == 404

    - name: Aguardar clone completar
      uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/qemu/{{ nat_gw_vm_id }}/status"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_token }}"
        validate_certs: false
      register: vm_status
      until: vm_status.json.data is defined
      retries: 30
      delay: 2
      when: vm_check.status == 404

    - name: Configurar VM (CPU, memória, rede)
      uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/qemu/{{ nat_gw_vm_id }}/config"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_token }}"
        body_format: form-urlencoded
        body:
          cores: "{{ nat_gw_cores }}"
          memory: "{{ nat_gw_memory_mb }}"
          net0: "virtio,bridge={{ vmbr0 | default('vmbr0') }}"
          net1: "virtio,bridge={{ vmbr0 | default('vmbr0') }}"
          ipconfig0: "ip={{ nat_gw_private_ip }}"
          ipconfig1: "ip={{ nat_gw_public_ip }},gw={{ nat_gw_public_gw }}"
          sshkeys: "{{ ssh_public_key | urlencode }}"
          ciuser: "{{ default_username | default('ubuntu') }}"
          agent: 1
        validate_certs: false
      when: vm_check.status == 404

    - name: Expandir disco para {{ nat_gw_disk_gb }}G
      uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/qemu/{{ nat_gw_vm_id }}/resize"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_token }}"
        body_format: form-urlencoded
        body:
          disk: scsi0
          size: "+{{ nat_gw_disk_gb | int - 3 }}G"  # +5G (template é 2.2G, vira 7.2G)
        validate_certs: false
      when: vm_check.status == 404

    - name: Iniciar VM 200
      uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/qemu/{{ nat_gw_vm_id }}/status/start"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_token }}"
        validate_certs: false
      when: vm_check.status == 404

    - name: Aguardar SSH ficar disponível
      wait_for:
        host: "{{ nat_gw_public_ip | ipaddr('address') }}"
        port: 22
        timeout: 180
      delegate_to: localhost
      when: vm_check.status == 404

    - name: nat-gw provisionado
      debug:
        msg: "nat-gw (VM 200) provisionado e acessível via SSH em {{ nat_gw_public_ip | ipaddr('address') }}"
